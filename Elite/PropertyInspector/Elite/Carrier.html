<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=apple-mobile-web-app-status-bar-style content=black>
    <title>Mhwlng's Elite</title>
    <link rel="stylesheet" href="../sdpi.css">
    <link rel="stylesheet" href="../jquery.highlight-within-textarea.css">
    <script src="../sdtools.common.js"></script>
    <script src="../jquery-3.3.1.min.js"></script>
    <script src="../jquery.highlight-within-textarea.js"></script>
</head>
<body>
<div class="sdpi-wrapper">

    <div class="sdpi-item" id="dvPrimaryImage">
        <div class="sdpi-item-label" onclick="clearFileName('primaryImage');">Active Image</div>
        <div class="sdpi-item-group file" id="filepickergroup1">
            <input class="sdpi-item-value sdProperty sdFile" type="file" id="primaryImage" accept=".jpg, .jpeg, .png, .ico, .gif, .bmp, .tiff" oninput="setSettings()">
            <label class="sdpi-file-info " for="primaryImage" id="primaryImageFilename">No file...</label>
            <label class="sdpi-file-label" for="primaryImage">Choose file...</label>
        </div>
    </div>

    <div class="sdpi-item" id="dvDefaultImage">
        <div class="sdpi-item-label" onclick="clearFileName('defaultImage');">Inactive Image</div>
        <div class="sdpi-item-group file" id="filepickergroup2">
            <input class="sdpi-item-value sdProperty sdFile" type="file" id="defaultImage" accept=".jpg, .jpeg, .png, .ico, .gif, .bmp, .tiff" oninput="setSettings()">
            <label class="sdpi-file-info " for="defaultImage" id="defaultImageFilename">No file...</label>
            <label class="sdpi-file-label" for="defaultImage">Choose file...</label>
        </div>
    </div>

    <div class="sdpi-item" id="dvAlertImage">
        <div class="sdpi-item-label" onclick="clearFileName('alertImage');">Alert Image</div>
        <div class="sdpi-item-group file" id="filepickergroup3">
            <input class="sdpi-item-value sdProperty sdFile" type="file" id="alertImage" accept=".jpg, .jpeg, .png, .ico, .gif, .bmp, .tiff" oninput="setSettings()">
            <label class="sdpi-file-info " for="alertImage" id="alertImageFilename">No file...</label>
            <label class="sdpi-file-label" for="alertImage">Choose file...</label>
        </div>
    </div>

    <div type="color" class="sdpi-item" id="dvPrimaryColor">
        <div class="sdpi-item-label">Text Color</div>
        <input class="sdpi-item-value sdProperty" type="color" id="primaryColor" oninput="setSettings()">
    </div>

    <div type="color" class="sdpi-item" id="dvAlertColor">
        <div class="sdpi-item-label">Alert Color</div>
        <input class="sdpi-item-value sdProperty" type="color" id="alertColor" oninput="setSettings()">
    </div>

    <div class="sdpi-item" id="dvOption">
        <div class="sdpi-item-label">Low Tritium</div>
        <select class="sdpi-item-value select sdProperty" id="option" oninput="setSettings()">
            <option value="135">Under 135t</option>
            <option value="500">Under 500t</option>
            <option value="1000">Under 1000t</option>
            <option value="0">Never</option>
        </select>
    </div>

    <div class="sdpi-item">
        <details class="message info">
            <summary>About this board</summary>
            <p>Your fleet carrier: jump destination and countdown, location, tritium and balance. Updated whenever you open the carrier management screen. Turns to Alert during lockdown and when tritium is low.</p>
        </details>
    </div>

</div>
</body>
</html>
